        /* ===== 卡片 / 弹窗 / 通知样式 ===== */
        .item {

        }
        .item:hover {
            opacity: .95
        }

        /* 图片预览模态框 */
        .modal {
            display: none;
            position: fixed;
            z-index: 100000;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(4, 8, 16, .72);
            backdrop-filter: blur(6px)
        }
        .modal-content {
            margin: 5% auto;
            padding: 14px;
            border: 1px solid rgba(94, 231, 255, .45);
            width: 80%;
            max-width: 700px;
            border-radius: 14px;
            background: #0e1424;
            box-shadow: 0 18px 44px rgba(0, 0, 0, .7), 0 0 26px rgba(94, 231, 255, .18)
        }
        .modal-content img {
            border-radius: 10px
        }
        .close {
            color: #7f93bb;
            float: right;
            font-size: 30px;
            font-weight: bold;
            line-height: 1
        }
        .close:hover, .close:focus {
            color: #5ee7ff;
            text-decoration: none;
            cursor: pointer
        }

        /* 进站通知弹窗 */
        .web_notice {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 8, 16, .6);
            backdrop-filter: blur(5px);
            z-index: 99999
        }
        .web_notice_content {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 550px;
            background: linear-gradient(160deg, #141c30, #0b1120);
            transform: translate(-50%, -50%);
            border-radius: 18px;
            padding: 44px 40px;
            border: 1px solid rgba(94, 231, 255, .3);
            box-shadow: 0 18px 44px rgba(0, 0, 0, .7), 0 0 30px rgba(94, 231, 255, .15);
            text-align: center
        }
        .web_notice_content::before {
            content: "✦ ◈ ✦";
            display: block;
            color: #5ee7ff;
            font-size: 20px;
            letter-spacing: 10px;
            margin-bottom: 10px;
            animation: twinkle 1.6s ease-in-out infinite
        }
        .web_notice h3 {
            font-weight: 800;
            text-align: center;
            font-size: 26px;
            color: #eaf4ff;
            letter-spacing: 5px;
            text-shadow: 0 0 14px rgba(94, 231, 255, .5)
        }
        .web_notice p {
            font-size: 16px;
            margin-top: 20px;
            line-height: 30px;
            color: #8b9cc4
        }
        .web_notice a {
            display: block;
            background: linear-gradient(135deg, #5ee7ff, #7c6cff);
            color: #061019;
            text-align: center;
            font-weight: 700;
            font-size: 19px;
            line-height: 56px;
            margin: 38px auto 0;
            border-radius: 10px;
            width: 100%;
            box-shadow: 0 8px 22px rgba(94, 231, 255, .35);
            transition: transform .25s ease, box-shadow .25s ease
        }
        .web_notice a:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(124, 108, 255, .5);
            color: #061019
        }
        @keyframes twinkle {
            0%, 100% { opacity: .5 }
            50% { opacity: 1 }
        }
        @media (max-width:600px) {
            .web_notice_content { width: 90%; padding: 30px 20px }
            .web_notice h3 { font-size: 21px; letter-spacing: 3px }
            .web_notice a { font-size: 16px; line-height: 50px }
        }
    </style>

    <script>
        (function () {
            var tabs = document.querySelectorAll('.tab-item');
            var lists = document.querySelectorAll('.app-list');

            // 切换标签内容
            function activate(key) {
                for (var i = 0; i < lists.length; i++) {
                    lists[i].classList.toggle('is-active', lists[i].classList.contains(key));
                }
                for (var j = 0; j < tabs.length; j++) {
                    tabs[j].classList.toggle('active', tabs[j].getAttribute('data-target') === key);
                }
            }

            for (var i = 0; i < tabs.length; i++) {
                tabs[i].addEventListener('click', function () {
                    activate(this.getAttribute('data-target'));
                });
            }

            // 图片预览模态框
            window.showModal = function (imageSrc) {
                var tip = document.getElementById('modalTip');
                var img = document.getElementById('modalImage');
                tip.style.display = 'none';
                img.style.display = 'block';
                img.src = imageSrc;
                document.getElementById('myModal').style.display = 'block';
            };

            function closeModal() {
                document.getElementById('myModal').style.display = 'none';
            }

            document.querySelector('.modal .close').addEventListener('click', closeModal);
            document.getElementById('myModal').addEventListener('click', function (e) {
                if (e.target === this) closeModal();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' || e.keyCode === 27) closeModal();
            });
        })();
    </script>
