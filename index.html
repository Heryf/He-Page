    <script>
        (function () {
            // ---- 兼容层：IE8 用 attachEvent，以下工具与 config.js 里的保持一致 ----
            function on(el, type, fn) {
                if (!el) return;
                if (window.__siteOn) { window.__siteOn(el, type, fn); return; }
                if (el.addEventListener) el.addEventListener(type, fn, false);
                else if (el.attachEvent) el.attachEvent('on' + type, fn);
            }
            function addClass(el, cls) {
                if (!el) return;
                if (window.__siteAddClass) { window.__siteAddClass(el, cls); return; }
                if ((' ' + el.className + ' ').indexOf(' ' + cls + ' ') < 0) el.className += ' ' + cls;
            }
            function removeClass(el, cls) {
                if (!el) return;
                if (window.__siteRemoveClass) { window.__siteRemoveClass(el, cls); return; }
                el.className = (' ' + el.className + ' ').replace(' ' + cls + ' ', ' ').replace(/^\s+|\s+$/g, '');
            }
            // 触屏设备会同时触发 touchend 和 click，用时间戳去重，保证一次点击只执行一次
            function bindTap(el, fn) {
                if (!el) return;
                var last = 0;
                function handler(e) {
                    var now = new Date().getTime();
                    if (now - last < 400) return;
                    last = now;
                    fn.call(el, e || window.event);
                }
                on(el, 'click', handler);
                on(el, 'touchend', handler);
                on(el, 'MSPointerUp', handler);
            }

            var tabs = document.querySelectorAll('.tab-item');
            var lists = document.querySelectorAll('.app-list');

            // 切换标签内容
            function activate(key) {
                for (var i = 0; i < lists.length; i++) {
                    var isMatch = (' ' + lists[i].className + ' ').indexOf(' ' + key + ' ') > -1;
                    if (isMatch) addClass(lists[i], 'is-active');
                    else removeClass(lists[i], 'is-active');
                }
                for (var j = 0; j < tabs.length; j++) {
                    if (tabs[j].getAttribute('data-target') === key) addClass(tabs[j], 'active');
                    else removeClass(tabs[j], 'active');
                }
            }

            for (var i = 0; i < tabs.length; i++) {
                bindTap(tabs[i], function () {
                    activate(this.getAttribute('data-target'));
                });
            }

            // 图片预览模态框
            window.showModal = function (imageSrc) {
                var tip = document.getElementById('modalTip');
                var img = document.getElementById('modalImage');
                tip.style.display = 'none';
                img.style.display = 'block';
                img.src = imageSrc;
                document.getElementById('myModal').style.display = 'block';
            };

            function closeModal() {
                document.getElementById('myModal').style.display = 'none';
            }
            window.closeModal = closeModal;

            // 进站通知关闭（鼠标、触屏、触控笔都生效）
            var notice = document.getElementById('webNotice');
            function closeNotice() {
                if (!notice) return;
                notice.style.display = 'none';
                notice.style.visibility = 'hidden';
            }
            window.closeNotice = closeNotice;
            bindTap(document.getElementById('noticeBtn'), closeNotice);

            bindTap(document.querySelector('.modal .close'), closeModal);
            bindTap(document.getElementById('myModal'), function (e) {
                var t = (e && (e.target || e.srcElement)) || null;
                if (t === this) closeModal();
            });
            on(document, 'keydown', function (e) {
                e = e || window.event;
                if (e.keyCode === 27) closeModal();
            });
        })();
    </script>
